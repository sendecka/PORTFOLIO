<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Summary</title>

<link rel="stylesheet" href="../css/page2_summary.css">
</head>
<body>

<div class="page">

  <div class="header-row">
    <div class="header-title-block">
      <h1 class="header-title">Executive Summary</h1>
      <div class="header-sub">Key absenteeism indicators — 2025</div>
    </div>
        <nav class="pill-nav">
      <button  data-page="home">Home</button>
      <button class="is-active" data-page="summary">Summary</button>
      <button  data-page="trend">Time Trend</button>
      <button  data-page="root">Root Cause</button>
      <button  data-page="risk">Risk</button>
      <button  data-page="recommendations">Recommendations</button>
    </nav>
    <div style="justify-self: end;">
      <span class="filter-badge" id="filterBadge" style="display:none;">
        <span class="fb-label"></span>
        <button class="fb-clear" id="fbClear" aria-label="Wyczysc filtr">&times;</button>
      </span>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="main-grid">
    <div class="card">
      <div class="card-title-row">
        <p class="card-title" id="chartTitle">TOTAL ABSENCE AND BENCHMARK ALERT BY MONTH</p>
        <div class="legend">
          <span><span class="dot navy"></span>Total absence</span>
          <span><span class="dot red"></span>Benchmark alert</span>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="card">
      <p class="card-title">Total absence by reason</p>
      <div class="reason-list" id="reasonList"></div>
    </div>
  </div>

</div>




<script src="../vendor/chart.umd.js"></script>
<script src="../data/data.js"></script>
<script src="../js/page2_summary.js"></script>
</body>
</html>
